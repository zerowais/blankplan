<style>
:root{--bg:#0F0E1A;--card:#1A1830;--line:#2E2A55;--ink:#F4F2FF;--muted:#A9A3D6;--brand:#7B72FF;--onbrand:#FFFFFF;--gold:#FFE27A;--gold2:#F5B400;--logoink:#2E2A6B;--red:#FF8A98;--focus:#FFE27A}
@media (prefers-color-scheme: light){:root{--bg:#F6F5FF;--card:#FFFFFF;--line:#DDD9F5;--ink:#1B1840;--muted:#5D5891;--brand:#5B52E8;--red:#C2183A;--focus:#5B52E8}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-block:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;text-align:center}
.logo{width:64px;height:64px;margin:0 auto 10px;border-radius:16px;display:grid;place-items:center;font-size:34px;font-weight:900;color:var(--logoink);background:linear-gradient(135deg,var(--gold),var(--gold2))}
h1{margin:0 0 6px;font-size:24px}
.lead{margin:0 0 14px;color:var(--muted)}
ol{text-align:start;margin:0 0 6px;padding-inline-start:22px}
li{margin:6px 0}
.msg{min-height:1.4em;margin:10px 0 4px;font-weight:700}
.msg.bad{color:var(--red)}
.btn{display:block;width:100%;margin:10px 0 0;padding:14px;min-height:52px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:800;cursor:pointer;text-align:center}
.btn.primary{background:var(--brand);border-color:transparent;color:var(--onbrand)}
.btn:focus-visible,.btn:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.fine{margin:14px 0 0;font-size:13px;color:var(--muted)}
.nojs{max-width:420px;text-align:center}
[hidden]{display:none!important}
</style>
</head>

  function get(k) { try { return store ? store.getItem(k) : null; } catch (e) { return null; } }
  function drop(k) { try { if (store) store.removeItem(k); } catch (e) { /* ignore */ } }
  function say(text, bad) { msg.textContent = text; msg.className = bad ? 'msg bad' : 'msg'; }
  function when(iso) { var t = Date.parse(iso); return isNaN(t) ? '' : new Date(t).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }
  function readMeta() { try { var o = JSON.parse(get(K.meta) || 'null'); return o && typeof o === 'object' ? o : null; } catch (e) { return null; } }

  /* Swap this blank page for the app kept on the phone. The app clears the boot flag once it has started. */
  function launch(html) {
    try { store.setItem(K.boot, String(Date.now())); } catch (e) { /* the app still opens */ }
    document.open();
    document.write(html);
    document.close();
  }
  function afterLoad(fn) {
    if (document.readyState === 'complete') { setTimeout(fn, 0); return; }
    window.addEventListener('load', function () { setTimeout(fn, 0); });
  }

  function show(mode) {
    var cur = readMeta(), have = !!get(K.app), built = cur && cur.build ? when(cur.build) : '';
    steps.hidden = !(mode === 'first' && ios && !standalone);
    keep.hidden = !(have && (mode === 'update' || mode === 'recover'));
    if (mode === 'nostore') {
      lead.textContent = 'This browser is blocking storage, so the app can’t be kept here.';
      say('Turn off Private Browsing, or open Level Up from its Home Screen icon.', true);
      pickBtn.hidden = true;
    } else if (mode === 'update') {
      lead.textContent = 'Load a new version of the app. Your progress stays on this phone.';
      pickText.textContent = '📂 Choose the new LevelUpQuest.html';
      keep.textContent = 'Keep the current version' + (built ? ' (' + built + ')' : '');
    } else if (mode === 'recover') {
      lead.textContent = 'The app didn’t finish opening last time.';
      say('Try again, or choose the app file again. Your progress is safe.');
      keep.textContent = 'Try again';
    } else if (ios && !standalone) {
      lead.textContent = 'Your private launcher. Set it up from the Home Screen icon, because Safari keeps a separate copy.';
    }
    ui.hidden = false;
  }

  function accept(text, name) {
    if (!/^\s*<!doctype html/i.test(text) || !APP_MARK.test(text) || SELF_MARK.test(text)) {
      say('That isn’t the Level Up app. Choose LevelUpQuest.html.', true);
      return;
    }
    var m = BUILD_RE.exec(text), build = m ? m[1] : '', cur = readMeta();
    if (cur && cur.build && build && Date.parse(build) < Date.parse(cur.build) && get(K.app)) {
      if (!window.confirm('This file is an older version (' + when(build) + ') than the one you have (' + when(cur.build) + '). Load it anyway?')) { say('Kept your current version.'); return; }
    }
    try {
      store.setItem(K.app, text);
      store.setItem(K.meta, JSON.stringify({ name: String(name || '').slice(0, 120), chars: text.length, build: build, loaded: new Date().toISOString() }));
    } catch (e) {
      say('Your phone wouldn’t store the app (' + ((e && e.name) || 'error') + '). Free up some space and try again.', true);
      return;
    }
    drop(K.upd);
    launch(text);
  }

  pick.addEventListener('change', function () {
    var f = pick.files && pick.files[0];
    if (!f) return;
    if (f.size > MAX_BYTES) { pick.value = ''; say('That file is too big to be the Level Up app.', true); return; }
    say('Opening…');
    var r = new FileReader();
    r.addEventListener('load', function () { pick.value = ''; accept(String(r.result || ''), f.name); });
    r.addEventListener('error', function () { pick.value = ''; say('Couldn’t read that file. Try again.', true); });
    r.readAsText(f);
  });
  keep.addEventListener('click', function () { var h = get(K.app); if (h) launch(h); else show('first'); });

  if (!store) { show('nostore'); return; }
  var stored = get(K.app), wantsUpdate = get(K.upd) === '1', stuck = !!get(K.boot);
  if (wantsUpdate) drop(K.upd);
  if (stored && !wantsUpdate && !stuck) { afterLoad(function () { launch(stored); }); return; }
  show(!stored ? 'first' : wantsUpdate ? 'update' : 'recover');
})();
</script>
</body>
</html>
